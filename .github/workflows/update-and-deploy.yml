name: 更新皇马女足资讯并发布网页
on:
  push:
  workflow_dispatch:
    inputs:
      mode:
        description: 更新内容
        type: choice
        default: both
        options: [both, news, fixtures]
  schedule:
    - cron: '17 * * * *'
    - cron: '37 0 * * *'

concurrency:
  group: madrid-pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    if: github.event.repository.private == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: 验证解析器与失败保护
        run: python -m unittest discover -s tests -v
      - name: 选择更新任务
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = schedule ] && [ "$SCHEDULE" = '37 0 * * *' ]; then
            echo 'value=fixtures' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = schedule ]; then
            echo 'value=news' >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = workflow_dispatch ]; then
            echo "value=$MANUAL_MODE" >> "$GITHUB_OUTPUT"
          else
            echo 'value=both' >> "$GITHUB_OUTPUT"
          fi
      - name: 读取官方公开页面
        id: refresh
        continue-on-error: true
        env:
          MODE: ${{ steps.mode.outputs.value }}
        run: python scripts/update.py --mode "$MODE"
      - name: 检查待翻译标题
        id: translation-needed
        run: |
          echo "value=$(python scripts/translate.py --check)" >> "$GITHUB_OUTPUT"
          echo "model=$(python scripts/translate.py --check-model)" >> "$GITHUB_OUTPUT"
      - name: 恢复翻译模型缓存
        if: steps.translation-needed.outputs.model == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: translation-nllb-f8d333a-${{ runner.os }}
      - name: 安装免费离线翻译工具
        id: translation-install
        if: steps.translation-needed.outputs.model == 'true'
        continue-on-error: true
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir -r requirements-translation.txt
      - name: 为新标题生成中文粗译
        id: translate
        if: steps.translation-needed.outputs.value == 'true'
        continue-on-error: true
        env:
          HF_HUB_DISABLE_XET: '1'
          HF_HUB_DOWNLOAD_TIMEOUT: '90'
        run: python scripts/translate.py
      - name: 构建网页
        run: python scripts/build.py
      - name: 保存数据快照
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/feed.json site/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Update official women team feed'
            git push
          fi
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
          retention-days: 1
      - name: 发布 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5.0.1
      - name: 标记数据来源失败
        if: steps.refresh.outcome == 'failure' || steps.translate.outcome == 'failure' || steps.translation-install.outcome == 'failure'
        run: |
          echo '数据同步或标题翻译未全部成功；网页已保留可用数据，未翻译标题可阅读原文。'
          exit 1
